<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="https://nikosoko.com/images/nikosoko-favicon.jpg" />
    <link rel="alternate icon" type="image/jpeg" href="https://nikosoko.com/images/nikosoko-favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- SEO Meta Tags -->
    <title>NikoSoko - Skilled professionals near you in Kenya</title>
    <meta name="description" content="Find electricians, plumbers and other skilled people near you. See ratings and Sacco or training-centre verification before you call or book." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://nikosoko.com/" />
    <meta property="og:url" content="https://nikosoko.com/" />
    <meta property="og:title" content="NikoSoko - Skilled professionals near you in Kenya" />
    <meta property="og:description" content="Find electricians, plumbers and other skilled people near you. See ratings and Sacco or training-centre verification before you call or book." />
    <meta property="og:image" content="https://nikosoko.com/images/nikosoko-hero-banner-white.jpg" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NikoSoko" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="https://nikosoko.com/images/nikosoko-icon.jpg" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-white font-sans text-uber-black">
    <!-- Splash: shown the instant the app opens, before any script loads. Same black as the manifest's
         background_color, so the phone's own launch screen hands over without a flash. App.tsx fades it out
         once the first screen is ready (hideSplash). -->
    <style>
      #splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .35s ease}
      #splash.splash-hide{opacity:0;pointer-events:none}
      #splash .sp-box{--w:min(68vw,300px);position:relative;width:var(--w);display:flex;flex-direction:column;align-items:center;margin-top:calc(var(--w) * 0.12)}
      #splash .sp-logo{width:100%;height:auto;display:block;animation:sp-in .4s ease-out both}
      #splash .sp-fly{position:absolute;left:0;top:calc(var(--w) * -0.24);width:calc(var(--w) * 1.12);height:auto;overflow:visible}
      #splash .sp-trail{fill:none;stroke:#fff;stroke-opacity:.8;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:.1 6}
      #splash .sp-reveal{fill:none;stroke:#fff;stroke-width:10;stroke-dasharray:100;stroke-dashoffset:100;animation:sp-draw .8s .35s ease-out forwards}
      #splash .sp-plane{transform-box:fill-box;transform-origin:center;animation:sp-plane .8s .35s cubic-bezier(.3,.7,.4,1) both}
      #splash .sp-tag{margin:calc(var(--w) * 0.07) 0 0;font-family:Poppins,system-ui,sans-serif;font-weight:300;font-size:calc(var(--w) * 0.058);letter-spacing:.03em;color:#d6d6d6;white-space:nowrap;animation:sp-up .5s .9s ease-out both}
      @keyframes sp-in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
      @keyframes sp-draw{to{stroke-dashoffset:0}}
      @keyframes sp-plane{0%{opacity:0;transform:translate(6px,86px) scale(.45) rotate(25deg)}35%{opacity:1;transform:translate(26px,48px) scale(.7) rotate(-10deg)}70%{transform:translate(12px,12px) scale(.9) rotate(10deg)}100%{opacity:1;transform:none}}
      @keyframes sp-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){#splash *{animation:none!important}#splash .sp-reveal{stroke-dashoffset:0}}
    </style>
    <div id="splash" role="img" aria-label="Nikosoko — a ticket to your freedom">
      <div class="sp-box">
        <svg class="sp-fly" viewBox="0 -72 336 140" aria-hidden="true">
          <defs>
            <mask id="sp-mask" maskUnits="userSpaceOnUse" x="0" y="-80" width="360" height="160">
              <path class="sp-reveal" pathLength="100" d="M304 37 C324 35 330 8 312 -6 C296 -18 284 -36 298 -52" />
            </mask>
          </defs>
          <path class="sp-trail" mask="url(#sp-mask)" d="M304 37 C324 35 330 8 312 -6 C296 -18 284 -36 298 -52" />
          <g class="sp-plane">
            <path d="M296 -50 L330 -66 L309 -42 Z" fill="#fff" />
            <path d="M309 -42 L311 -33 L315 -47 Z" fill="#9a9a9a" />
          </g>
        </svg>
        <img class="sp-logo" src="/splash-logo.png" alt="" width="889" height="183" />
        <p class="sp-tag">a ticket to your freedom</p>
      </div>
    </div>
    <script>
      // Never leave the splash up if the app fails to start: it steps aside after 15 seconds regardless.
      window.hideSplash = function () {
        var s = document.getElementById('splash');
        if (!s || s.classList.contains('splash-hide')) return;
        s.classList.add('splash-hide');
        setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 400);
      };
      setTimeout(window.hideSplash, 15000);
    </script>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
