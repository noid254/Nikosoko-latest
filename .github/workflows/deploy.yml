name: Deploy — Production

# Deploys only after "CI — Lint & Build" has passed on main. A push to main does not deploy by itself, and a
# failed lint or build never reaches nikosoko.com.
on:
  workflow_run:
    workflows: ["CI — Lint & Build"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}

    steps:
      # Until the server login is added as repository secrets (VPS_HOST, VPS_USER, VPS_SSH_KEY), this job only
      # records that CI passed; deploy by hand on the server.
      - name: Server login not configured
        if: ${{ env.VPS_HOST == '' }}
        run: echo "CI passed for ${{ github.event.workflow_run.head_sha }}. Add VPS_HOST, VPS_USER and VPS_SSH_KEY secrets to deploy automatically."

      - name: Deploy to nikosoko.com
        if: ${{ env.VPS_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/sysadmin/htdocs/nikosoko.com
            # Rollback point: the commit that was live before this deploy.
            git rev-parse HEAD > .last-deployed-commit
            git fetch origin main
            # Deploy exactly the commit CI checked, and stop if the server has its own uncommitted edits.
            git merge --ff-only ${{ github.event.workflow_run.head_sha }}
            npm install --no-audit --no-fund
            npm run build
            pm2 restart nikosoko
